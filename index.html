<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Apuntes</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">

        <!-- ENCABEZADO -->
        <header class="header">

            <div class="header-top">

                <h1>📚 MIS APUNTES</h1>

                <button
                    id="btnMateria"
                    class="btn-materia"
                    type="button"
                >
                    MATERIA ▼
                </button>

            </div>


            <!-- FECHA Y MATERIA -->
            <div class="segunda-linea">

                <div
                    id="fecha"
                    class="fecha"
                ></div>

                <div
                    id="materiaSeleccionada"
                    class="materia-seleccionada"
                >
                    Seleccionar
                </div>

            </div>


            <!-- MENÚ DE MATERIAS -->
            <div
                id="menuMateria"
                class="menu-materia oculto"
            ></div>

        </header>


        <!-- ÁREA DE ESCRITURA -->
        <main class="contenido">

            <textarea
                id="nota"
                placeholder="Escribí acá tus apuntes..."
                spellcheck="true"
            ></textarea>


            <div class="informacion">

                <span id="contador">
                    0 caracteres
                </span>

                <span id="estado">
                    Nueva captura
                </span>

            </div>

        </main>


        <!-- BOTONES -->
        <div class="botones">

            <button
                id="btnCompartir"
                class="btn btn-herramienta"
                type="button"
            >
                COMPARTIR
            </button>


            <button
                id="btnTexto"
                class="btn btn-herramienta"
                type="button"
            >
                CÓDIGOS
            </button>


            <button
                id="btnIA"
                class="btn btn-herramienta"
                type="button"
            >
                IA
            </button>


            <button
                id="btnGuardar"
                class="btn btn-guardar"
                type="button"
            >
                GUARDAR
            </button>

        </div>


        <!-- MENSAJE -->
        <div
            id="mensaje"
            class="mensaje"
        ></div>


        <!-- CONFIGURACIÓN -->
        <div
            id="modalConfiguracion"
            class="modal oculto"
        >

            <div class="modal-contenido">

                <div class="modal-header">

                    <h2>CONFIGURACIÓN</h2>


                    <button
                        id="btnCerrarConfiguracion"
                        class="btn-cerrar"
                        type="button"
                    >
                        ×
                    </button>

                </div>


                <h3>Materias</h3>


                <div
                    id="listaMaterias"
                    class="lista-materias"
                ></div>


                <div class="agregar-materia">

                    <input
                        type="text"
                        id="nuevaMateria"
                        placeholder="Nueva materia"
                    >


                    <button
                        id="btnAgregarMateria"
                        type="button"
                    >
                        ＋ AGREGAR
                    </button>

                </div>


                <button
                    id="btnCerrarModal"
                    class="btn-modal-cerrar"
                    type="button"
                >
                    CERRAR
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         SUPABASE
         ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================================
         CONFIGURACIÓN DE MIS APUNTES
         ========================================= -->

    <script>

        const SUPABASE_URL =
            "https://rodaerqzebwzcawbpvps.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_OOZo2L1bV0Ble2DgvWxbglg_I5bD1ykO";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

    </script>


    <!-- =========================================
         PROGRAMA PRINCIPAL
         ========================================= -->

    <script src="script.js"></script>

</body>

</html>
